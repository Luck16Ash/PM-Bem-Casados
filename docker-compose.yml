services:

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pm-bem-casados-frontend
    ports:
      - "4200:4200"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pm-bem-casados-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pm_bem_casados
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    depends_on:
      postgres:
        condition: service_healthy

  data:
    build:
      context: ./data
      dockerfile: Dockerfile
    container_name: pm-bem-casados-data
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    container_name: pm-bem-casados-postgres
    environment:
      POSTGRES_DB: pm_bem_casados
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pm_bem_casados"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: